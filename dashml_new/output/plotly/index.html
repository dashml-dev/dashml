  <style>

<body>

  <script>
    const theme = {"background": "#f5f5f5", "card": "#ffffff", "text": "#333333", "primary": "#1f77b4", "secondary": ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#7f7f7f", "#bcbd22", "#17becf"]};
    // Column types from INFORMATION_SCHEMA (auto-detected)
    let columnTypes = {};

    // Get effective x_type: explicit > schema-detected > undefined
    function getEffectiveXType(xColumn, explicitXType) {
      if (explicitXType) return explicitXType;
      return columnTypes[xColumn] || undefined;
    }

    // Apply filters to data
    function applyFilters(data, filters) {
      if (!filters || filters.length === 0) return data;
      return data.filter(row => {
        return filters.every(f => {
          const val = row[f.field];
          switch (f.op) {
            case 'eq': return val === f.value;
            case 'ne': return val !== f.value;
            case 'gt': return val > f.value;
            case 'lt': return val < f.value;
            case 'gte': return val >= f.value;
            case 'lte': return val <= f.value;
            case 'in': return Array.isArray(f.value) && f.value.includes(val);
            case 'contains': return String(val).includes(f.value);
            default: return true;
          }
        });
      });
    }

    // Cast y values based on y_type
    function castYValues(data, y, yType) {
      if (!yType) return data;
      return data.map(row => {
        const newRow = {...row};
        if (yType === 'number') {
          newRow[y] = parseFloat(row[y]) || 0;
        } else if (yType === 'string') {
          newRow[y] = String(row[y]);
        }
        return newRow;
      });
    }

    // Sort aggregated data
    function sortData(data, sortField, sortOrder, xType) {
      const result = [...data];
      const ascending = sortOrder !== 'desc';

      if (sortField === 'y') {
        result.sort((a, b) => ascending ? a.y - b.y : b.y - a.y);
      } else if (sortField === 'x') {
        if (xType === 'date') {
          result.sort((a, b) => {
            const diff = new Date(a.x) - new Date(b.x);
            return ascending ? diff : -diff;
          });
        } else if (xType === 'number') {
          result.sort((a, b) => ascending ? a.x - b.x : b.x - a.x);
        } else {
          result.sort((a, b) => {
            const cmp = String(a.x).localeCompare(String(b.x));
            return ascending ? cmp : -cmp;
          });
        }
      } else if (xType === 'date') {
        // Default: sort by date if x_type is date
        result.sort((a, b) => new Date(a.x) - new Date(b.x));
      } else if (xType === 'number') {
        result.sort((a, b) => parseFloat(a.x) - parseFloat(b.x));
      } else {
        // Default: sort strings alphabetically for consistency across transformers
        result.sort((a, b) => String(a.x).localeCompare(String(b.x)));
      }
      return result;
    }

    function aggregateData(data, x, y, agg, options) {
      options = options || {};
      const xType = options.xType || getEffectiveXType(x, options.xType);
      const yType = options.yType;
      const filters = options.filters || [];
      const sortField = options.sort;
      const sortOrder = options.sortOrder || 'asc';
      const limit = options.limit;
      const sizeField = options.sizeField;

      // Apply filters first
      let filtered = applyFilters(data, filters);

      // Cast y values
      filtered = castYValues(filtered, y, yType);

      const grouped = {};
      filtered.forEach(row => {
        const key = row[x];
        if (!grouped[key]) grouped[key] = { values: [], count: 0, sizeValues: [] };
        grouped[key].values.push(row[y]);
        grouped[key].count++;
        if (sizeField) grouped[key].sizeValues.push(parseFloat(row[sizeField]) || 0);
      });

      let result = [];
      Object.keys(grouped).forEach(key => {
        const values = grouped[key].values;
        let aggregated;
        switch (agg) {
          case 'sum': aggregated = values.reduce((a, b) => a + b, 0); break;
          case 'mean': aggregated = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggregated = grouped[key].count; break;
          default: aggregated = values.reduce((a, b) => a + b, 0);
        }
        const entry = { x: key, y: aggregated };
        if (sizeField) {
          const sizeVals = grouped[key].sizeValues;
          switch (agg) {
            case 'sum': entry.size = sizeVals.reduce((a, b) => a + b, 0); break;
            case 'mean': entry.size = sizeVals.reduce((a, b) => a + b, 0) / sizeVals.length; break;
            case 'count': entry.size = grouped[key].count; break;
            default: entry.size = sizeVals.reduce((a, b) => a + b, 0);
          }
        }
        result.push(entry);
      });

      // Sort
      result = sortData(result, sortField, sortOrder, xType);

      // Limit
      if (limit && limit > 0) {
        result = result.slice(0, limit);
      }

      return result;
    }

    function aggregateDataWithGroup(data, x, y, groupField, agg, options) {
      options = options || {};
      const xType = options.xType || getEffectiveXType(x, options.xType);
      const yType = options.yType;
      const filters = options.filters || [];
      const sortField = options.sort;
      const sortOrder = options.sortOrder || 'asc';
      const limit = options.limit;

      // Apply filters first
      let filtered = applyFilters(data, filters);

      // Cast y values
      filtered = castYValues(filtered, y, yType);

      const grouped = {};
      filtered.forEach(row => {
        const xKey = row[x];
        const groupKey = row[groupField];
        const compositeKey = xKey + '|||' + groupKey;
        if (!grouped[compositeKey]) grouped[compositeKey] = { x: xKey, group: groupKey, values: [], count: 0 };
        grouped[compositeKey].values.push(row[y]);
        grouped[compositeKey].count++;
      });

      let result = [];
      Object.keys(grouped).forEach(key => {
        const entry = grouped[key];
        const values = entry.values;
        let aggregated;
        switch (agg) {
          case 'sum': aggregated = values.reduce((a, b) => a + b, 0); break;
          case 'mean': aggregated = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggregated = entry.count; break;
          default: aggregated = values.reduce((a, b) => a + b, 0);
        }
        result.push({ x: entry.x, group: entry.group, y: aggregated });
      });

      // Sort based on sortField or default x_type
      result = sortData(result, sortField, sortOrder, xType);

      // Limit
      if (limit && limit > 0) {
        result = result.slice(0, limit);
      }

      return result;
    }

    // Aggregate data for bubble charts: group by groupField, aggregate x, y, size independently
    function aggregateBubbleData(data, groupField, xMetric, yMetric, sizeMetric, agg, options) {
      options = options || {};
      const filters = options.filters || [];
      const sortField = options.sort;
      const sortOrder = options.sortOrder || 'asc';
      const limit = options.limit;

      let filtered = applyFilters(data, filters);

      const grouped = {};
      filtered.forEach(row => {
        const key = row[groupField];
        if (!grouped[key]) grouped[key] = { xValues: [], yValues: [], sizeValues: [], count: 0 };
        grouped[key].xValues.push(parseFloat(row[xMetric]) || 0);
        grouped[key].yValues.push(parseFloat(row[yMetric]) || 0);
        grouped[key].sizeValues.push(parseFloat(row[sizeMetric]) || 0);
        grouped[key].count++;
      });

      function aggArray(values, count) {
        switch (agg) {
          case 'sum': return values.reduce((a, b) => a + b, 0);
          case 'mean': return values.reduce((a, b) => a + b, 0) / values.length;
          case 'count': return count;
          default: return values.reduce((a, b) => a + b, 0);
        }
      }

      let result = [];
      Object.keys(grouped).forEach(key => {
        const g = grouped[key];
        result.push({
          group: key,
          x: aggArray(g.xValues, g.count),
          y: aggArray(g.yValues, g.count),
          size: aggArray(g.sizeValues, g.count)
        });
      });

      if (sortField === 'y') {
        const asc = sortOrder !== 'desc';
        result.sort((a, b) => asc ? a.y - b.y : b.y - a.y);
      } else {
        const asc = sortOrder !== 'desc';
        result.sort((a, b) => asc ? a.x - b.x : b.x - a.x);
      }

      if (limit && limit > 0) {
        result = result.slice(0, limit);
      }

      return result;
    }


    function render_bar_sales_by_country(data) {
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null};
      const grouped = aggregateData(data, 'shipping_address_country', 'total_amount', 'sum', options);
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      let traces = [];
      switch ('bar') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', nbinsx: 20, marker: { color: theme.primary } };
          break;
        case 'box':
          // Box plot: shows distribution (min, Q1, median, Q3, max)
          const boxGroups_bar_sales_by_country = [...new Set(data.map(d => d['shipping_address_country']))];
          boxGroups_bar_sales_by_country.forEach(group => {
            traces.push({
              y: data.filter(d => d['shipping_address_country'] === group).map(d => parseFloat(d['total_amount'])),
              name: group,
              type: 'box',
              marker: { color: theme.primary }
            });
          });
          break;
        case 'geo':
          trace = {
            type: 'choropleth',
            locations: xValues,
            z: yValues,
            locationmode: 'country names',
            colorscale: 'Blues',
            colorbar: { title: 'total_amount' }
          };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      if (trace) traces.push(trace);

      let layout;
      if ('bar' === 'geo') {
        layout = {
          title: { text: 'Total Sales by Country', font: { color: theme.text } },
          geo: {
            showframe: false,
            showcoastlines: true,
            projection: { type: 'natural earth' },
            bgcolor: 'rgba(0,0,0,0)'
          },
          margin: { t: 60, r: 0, b: 0, l: 0 },
          paper_bgcolor: 'rgba(0,0,0,0)'
        };
      } else {
        layout = {
          title: { text: 'Total Sales by Country', font: { color: theme.text } },
          xaxis: { title: 'shipping_address_country', color: theme.text, gridcolor: theme.text + '20' },
          yaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },
          margin: { t: 60, r: 40, b: 60, l: 60 },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor: 'rgba(0,0,0,0)'
        };
      }

      Plotly.newPlot('chart-bar_sales_by_country', traces, layout, { responsive: true });
    }
    function render_pie_orders_by_status(data) {
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null};
      const grouped = aggregateData(data, 'status', 'order_id', 'count', options);
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      let traces = [];
      switch ('pie') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', nbinsx: 20, marker: { color: theme.primary } };
          break;
        case 'box':
          // Box plot: shows distribution (min, Q1, median, Q3, max)
          const boxGroups_pie_orders_by_status = [...new Set(data.map(d => d['status']))];
          boxGroups_pie_orders_by_status.forEach(group => {
            traces.push({
              y: data.filter(d => d['status'] === group).map(d => parseFloat(d['order_id'])),
              name: group,
              type: 'box',
              marker: { color: theme.primary }
            });
          });
          break;
        case 'geo':
          trace = {
            type: 'choropleth',
            locations: xValues,
            z: yValues,
            locationmode: 'country names',
            colorscale: 'Blues',
            colorbar: { title: 'order_id' }
          };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      if (trace) traces.push(trace);

      let layout;
      if ('pie' === 'geo') {
        layout = {
          title: { text: 'Orders by Status', font: { color: theme.text } },
          geo: {
            showframe: false,
            showcoastlines: true,
            projection: { type: 'natural earth' },
            bgcolor: 'rgba(0,0,0,0)'
          },
          margin: { t: 60, r: 0, b: 0, l: 0 },
          paper_bgcolor: 'rgba(0,0,0,0)'
        };
      } else {
        layout = {
          title: { text: 'Orders by Status', font: { color: theme.text } },
          xaxis: { title: 'status', color: theme.text, gridcolor: theme.text + '20' },
          yaxis: { title: 'order_id', color: theme.text, gridcolor: theme.text + '20' },
          margin: { t: 60, r: 40, b: 60, l: 60 },
          paper_bgcolor: 'rgba(0,0,0,0)',
          plot_bgcolor: 'rgba(0,0,0,0)'
        };
      }

      Plotly.newPlot('chart-pie_orders_by_status', traces, layout, { responsive: true });
    }
    function render_grouped_bar_country_status(data) {
      // Stacked/grouped bars need multiple traces
      const options = {"xType": null, "yType": null, "filters": [], "sort": "y", "sortOrder": "desc", "limit": null};
      const aggregated = aggregateDataWithGroup(data, 'shipping_address_country', 'order_id', 'status', 'count', options);
      const groupValues = [...new Set(aggregated.map(d => d.group))];

      const traces = [];
      groupValues.forEach((groupVal, idx) => {
        const filtered = aggregated.filter(d => d.group === groupVal);
        traces.push({
          x: filtered.map(d => d.x),
          y: filtered.map(d => d.y),
          name: groupVal,
          type: 'bar',
          marker: { color: theme.secondary[idx % theme.secondary.length] }
        });
      });

      const layout = {
        title: { text: 'Orders by Country (Grouped by Status)', font: { color: theme.text } },
        xaxis: { title: 'shipping_address_country', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'order_id', color: theme.text, gridcolor: theme.text + '20' },
        barmode: 'group',
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-grouped_bar_country_status', traces, layout, { responsive: true });
    }
    function render_stacked_bar_payment_status(data) {
      // Stacked/grouped bars need multiple traces
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null};
      const aggregated = aggregateDataWithGroup(data, 'payment_method', 'order_id', 'status', 'count', options);
      const groupValues = [...new Set(aggregated.map(d => d.group))];

      const traces = [];
      groupValues.forEach((groupVal, idx) => {
        const filtered = aggregated.filter(d => d.group === groupVal);
        traces.push({
          x: filtered.map(d => d.x),
          y: filtered.map(d => d.y),
          name: groupVal,
          type: 'bar',
          marker: { color: theme.secondary[idx % theme.secondary.length] }

      const layout = {

        xaxis: { title: 'payment_method', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'order_id', color: theme.text, gridcolor: theme.text + '20' },

        margin: { t: 60, r: 40, b: 60, l: 60 },

        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-stacked_bar_payment_status', traces, layout, { responsive: true });
    }
    function render_geo_sales_by_country(data) {
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null};
      const grouped = aggregateData(data, 'shipping_address_country', 'total_amount', 'sum', options);
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      let traces = [];
      switch ('geo') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', nbinsx: 20, marker: { color: theme.primary } };
          break;
        case 'box':
          // Box plot: shows distribution (min, Q1, median, Q3, max)
          const boxGroups_geo_sales_by_country = [...new Set(data.map(d => d['shipping_address_country']))];
          boxGroups_geo_sales_by_country.forEach(group => {
            traces.push({
              y: data.filter(d => d['shipping_address_country'] === group).map(d => parseFloat(d['total_amount'])),
              name: group,
              type: 'box',
              marker: { color: theme.primary }
            });
          });
          break;
        case 'geo':
          trace = {
            type: 'choropleth',
            locations: xValues,
            z: yValues,
            locationmode: 'country names',
            colorscale: 'Blues',
            colorbar: { title: 'total_amount' }
          };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

    function render_bubble_region_sales(data) {
      // Bubble chart: 4D visualization (group, x, y, size)
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null, "sizeField": "total_amount"};
      const bubbleData = aggregateBubbleData(data, 'shipping_address_state', 'total_amount', 'tax_amount', 'total_amount', 'sum', options);
      const bubbleSizeVals = bubbleData.map(d => Math.abs(d.size));
      const maxSize = Math.max(...bubbleSizeVals);
      const normalizedSizes = bubbleSizeVals.map(v => 10 + (v / maxSize) * 50);

      const trace = {
        x: bubbleData.map(d => d.x),
        y: bubbleData.map(d => d.y),
        text: bubbleData.map(d => d.group),
        type: 'scatter',
        mode: 'markers+text',
        textposition: 'top center',
        marker: {
          size: normalizedSizes,
          color: theme.secondary ? theme.secondary.slice(0, bubbleData.length) : theme.primary,
          sizemode: 'diameter'
        },
        hovertemplate: bubbleData.map(d => d.group + '<br>total_amount: ' + d.x + '<br>tax_amount: ' + d.y + '<br>total_amount: ' + d.size + '<extra></extra>')
      };

      const layout = {
        title: { text: 'Sales vs Tax by Region', font: { color: theme.text } },
        xaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },

    function render_heatmap_country_status(data) {
      // Heatmap: 2D grid with color intensity
      const options = {"xType": null, "yType": null, "filters": [], "sort": null, "sortOrder": "asc", "limit": null};
      const aggregated = aggregateDataWithGroup(data, 'shipping_address_country', 'order_id', 'status', 'count', options);
      const heatmapX = [...new Set(aggregated.map(d => d.x))];
      const heatmapY = [...new Set(aggregated.map(d => d.group))];
      const heatmapZ = heatmapY.map(yVal =>
        heatmapX.map(xVal => {
          const found = aggregated.find(d => d.x === xVal && d.group === yVal);
          return found ? found.y : 0;
        })
      );

      const trace = { x: heatmapX, y: heatmapY, z: heatmapZ, type: 'heatmap', colorscale: 'Blues' };

      const layout = {
        title: { text: 'Order Count by Country and Status', font: { color: theme.text } },
        xaxis: { title: 'shipping_address_country', color: theme.text },
        yaxis: { title: 'status', color: theme.text },

        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-heatmap_country_status', [trace], layout, { responsive: true });
    }


    function showPage(pageId, clickedButton) {
      document.querySelectorAll('.page-container').forEach(page => {
        page.style.display = 'none';
      });
      document.querySelectorAll('.tab-button').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById('page-' + pageId).style.display = 'block';
      if (clickedButton) {
        clickedButton.classList.add('active');
      }
    }


    function renderAllPages(data) {
      render_bar_sales_by_country(data);
      render_pie_orders_by_status(data);
      render_grouped_bar_country_status(data);
      render_stacked_bar_payment_status(data);
      render_geo_sales_by_country(data);
      render_line_orders_over_time(data);
      render_area_revenue_over_time(data);
      render_scatter_amount_vs_tax(data);
      render_histogram_order_amounts(data);
      render_box_amount_by_status(data);
      render_bubble_region_sales(data);
      render_heatmap_country_status(data);
    }

    // Fetch schema first, then data
    Promise.all([
      fetch('/api/schema').then(r => r.json()),
      fetch('/api/data').then(r => r.json())
    ])
      .then(([schema, data]) => {
        columnTypes = schema;

        // Parse ISO 8601 date strings to Date objects
        // Server already cast types, we just need to parse ISO dates
        const parsedData = data.map(row => {
          const parsedRow = {};
          for (const [column, value] of Object.entries(row)) {
            if (columnTypes[column] === 'date' && value !== null) {
              // Parse ISO 8601 date string (e.g., "2023-01-05T00:00:00.000Z")
              parsedRow[column] = new Date(value);
            } else {
              // Numbers are already parsed by JSON, strings stay as strings
              parsedRow[column] = value;
            }
          }
          return parsedRow;
        });

        console.log('Column types from INFORMATION_SCHEMA:', columnTypes);
        renderAllPages(parsedData);
      })
      .catch(error => console.error('Error loading data:', error));

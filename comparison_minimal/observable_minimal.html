<!DOCTYPE html>
<html>
<head>
  <title>Simple Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
</head>
<body>
  <h1>Simple Dashboard</h1>
  <div id="chart"></div>
  <script>
    fetch('/api/data')
      .then(r => r.json())
      .then(data => {
        // Aggregate: sum sales by country
        const aggregated = d3.rollups(data, v => d3.sum(v, d => d.sales), d => d.country)
          .map(([country, sales]) => ({ country, sales }));
        
        const plot = Plot.plot({
          marks: [Plot.barY(aggregated, { x: "country", y: "sales" })]
        });
        document.getElementById('chart').appendChild(plot);
      });
  </script>
</body>
</html>

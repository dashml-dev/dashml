<!DOCTYPE html>
<html>
<head>
  <title>Sales Trend</title>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
</head>
<body>
  <h1>Sales Trend</h1>
  <div id="chart"></div>
  <script>
    fetch('/api/data')
      .then(r => r.json())
      .then(data => {
        // Aggregate: sum total_amount by order_date
        const grouped = {};
        data.forEach(row => {
          grouped[row.order_date] = (grouped[row.order_date] || 0) + row.total_amount;
        });
        
        // Sort by date
        const sorted = Object.entries(grouped)
          .map(([x, y]) => ({ x: new Date(x), y }))
          .sort((a, b) => a.x - b.x);
        
        Plotly.newPlot('chart', [{
          x: sorted.map(d => d.x),
          y: sorted.map(d => d.y),
          type: 'scatter',
          mode: 'lines+markers'
        }], { title: 'Sales Over Time' });
      });
  </script>
</body>
</html>

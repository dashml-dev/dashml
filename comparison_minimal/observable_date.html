<!DOCTYPE html>
<html>
<head>
  <title>Sales Trend</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
</head>
<body>
  <h1>Sales Trend</h1>
  <div id="chart"></div>
  <script>
    fetch('/api/data')
      .then(r => r.json())
      .then(data => {
        // Aggregate and sort by date
        const aggregated = d3.rollups(data, 
          v => d3.sum(v, d => d.total_amount), 
          d => d.order_date
        ).map(([date, amount]) => ({ 
          order_date: new Date(date), 
          total_amount: amount 
        })).sort((a, b) => a.order_date - b.order_date);
        
        const plot = Plot.plot({
          marks: [
            Plot.line(aggregated, { x: "order_date", y: "total_amount" }),
            Plot.dot(aggregated, { x: "order_date", y: "total_amount" })
          ]
        });
        document.getElementById('chart').appendChild(plot);
      });
  </script>
</body>
</html>

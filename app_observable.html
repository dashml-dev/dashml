<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, sans-serif;
            background-color: #282a36;
            color: #f8f8f2;
            padding: 2rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .card {
            margin-bottom: 3rem;
            background: #313343;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .page-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: #f8f8f2;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        .tab-button.active {
            opacity: 1;
            border-bottom-color: #bd93f9;
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        .page-description {
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        /* Observable Plot chart styling */
        svg {
            background: transparent;
        }
    </style>
</head>
<body>
    <h1>Sales Analytics Dashboard</h1>

    <script>
        // Load and parse CSV data
        let dashmlData = [];

        fetch('data/example.csv')
            .then(response => response.text())
            .then(csvText => {
                dashmlData = parseCSV(csvText);
                renderAllCharts();
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.body.innerHTML += '<p style="color: red;">Error loading data file: data/example.csv</p>';
            });

        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n').filter(line => line.trim());
            const headers = lines[0].split(',').map(h => h.trim());
            const rows = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length !== headers.length) continue;

                const row = {};
                headers.forEach((header, index) => {
                    const value = values[index] ? values[index].trim() : '';
                    // Try to parse as number first
                    if (!isNaN(value) && value !== '') {
                        row[header] = parseFloat(value);
                    }
                    // Check if it looks like a date (YYYY-MM-DD or similar)
                    else if (/^\d{4}-\d{2}-\d{2}/.test(value)) {
                        row[header] = new Date(value);
                    }
                    // Keep as string
                    else {
                        row[header] = value;
                    }
                });
                rows.push(row);
            }
            return rows;
        }
    </script>
    <div class="page-tabs">
        <button class="tab-button active" onclick="showPage('overview', this)">📊 Overview</button>
        <button class="tab-button" onclick="showPage('trends', this)">📈 Trends</button>
        <button class="tab-button" onclick="showPage('detailed', this)">🔍 Detailed Analysis</button>
    </div>
    <div id="page-overview" class="page-content active">
        <p class="page-description">High-level sales metrics and KPIs</p>
        <div class="card">
            <h2>Total Sales by Country</h2>
            <div id="chart-overview-total_sales_by_country"></div>
        </div>
        <div class="card">
            <h2>Market Share by Country</h2>
            <div id="chart-overview-country_sales_breakdown"></div>
        </div>
    </div>
    <div id="page-trends" class="page-content">
        <p class="page-description">Sales trends and patterns over time</p>
        <div class="card">
            <h2>Sales Over Time</h2>
            <div id="chart-trends-sales_over_time"></div>
        </div>
        <div class="card">
            <h2>Average Daily Sales</h2>
            <div id="chart-trends-average_sales_trend"></div>
        </div>
    </div>
    <div id="page-detailed" class="page-content">
        <p class="page-description">In-depth breakdown and analysis</p>
        <div class="card">
            <h2>Number of Transactions by Country</h2>
            <div id="chart-detailed-sales_count_by_country"></div>
        </div>
        <div class="card">
            <h2>Sales Distribution Over Time</h2>
            <div id="chart-detailed-sales_scatter"></div>
        </div>
    </div>
    <script>
        function showPage(pageId, buttonElement) {
            // Hide all pages
            document.querySelectorAll('.page-content').forEach(page => {
                page.classList.remove('active');
            });

            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected page
            document.getElementById('page-' + pageId).classList.add('active');
            buttonElement.classList.add('active');
        }

        function renderAllCharts() {
            // Chart: total_sales_by_country
            const data_total_sales_by_country = d3.rollups(
                dashmlData,
                v => d3.sum(v, d => d['sales']),
                d => d['country']
            ).map(([country, sales]) => ({ country, sales }));
            const plot_total_sales_by_country = Plot.plot({
                marks: [
                    Plot.barY(data_total_sales_by_country, {
                        x: "country",
                        y: "sales",
                        fill: "#bd93f9",
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-total_sales_by_country').appendChild(plot_total_sales_by_country);
            // D3 Pie Chart
            const data_country_sales_breakdown = d3.rollups(
                dashmlData,
                v => d3.sum(v, d => d['sales']),
                d => d['country']
            ).map(([country, sales]) => ({ country, sales }));
            const pieWidth = 400;
            const pieHeight = 400;
            const legendWidth = 150;
            const totalWidth = pieWidth + legendWidth;
            const radius = Math.min(pieWidth, pieHeight) / 2 - 10;

            const pie = d3.pie().value(d => d.sales);
            const arc = d3.arc().innerRadius(0).outerRadius(radius);

            // Use theme secondary colors for categorical data
            const themeColors = ['#50fa7b', '#ffb86c', '#ff5555', '#8be9fd', '#f1fa8c'];
            const color = d3.scaleOrdinal()
                .domain(data_country_sales_breakdown.map(d => d.country))
                .range(themeColors);

            const svg = d3.create("svg")
                .attr("width", totalWidth)
                .attr("height", pieHeight)
                .attr("viewBox", [0, 0, totalWidth, pieHeight])
                .attr("style", "max-width: 100%; height: auto;");

            // Pie chart group (centered in left portion)
            const pieGroup = svg.append("g")
                .attr("transform", `translate(${pieWidth / 2}, ${pieHeight / 2})`);

            pieGroup.selectAll("path")
                .data(pie(data_country_sales_breakdown))
                .join("path")
                .attr("fill", d => color(d.data.country))
                .attr("d", arc)
                .attr("stroke", "white")
                .attr("stroke-width", 2)
                .append("title")
                .text(d => `${d.data.country}: ${d.data.sales}`);

            // Legend (positioned on the right)
            const legend = svg.append("g")
                .attr("transform", `translate(${pieWidth + 10}, 20)`);

            data_country_sales_breakdown.forEach((d, i) => {
                const legendRow = legend.append("g")
                    .attr("transform", `translate(0, ${i * 25})`);

                legendRow.append("rect")
                    .attr("width", 15)
                    .attr("height", 15)
                    .attr("fill", color(d.country))
                    .attr("rx", 2);

                legendRow.append("text")
                    .attr("x", 22)
                    .attr("y", 12)
                    .attr("fill", "#f8f8f2")
                    .style("font-size", "13px")
                    .text(d.country);
            });

            document.getElementById('chart-overview-country_sales_breakdown').appendChild(svg.node());
            // Chart: sales_over_time
            const data_sales_over_time = d3.rollups(
                dashmlData,
                v => d3.sum(v, d => d['sales']),
                d => d['date']
            ).map(([date, sales]) => ({ date, sales }));
            const plot_sales_over_time = Plot.plot({
                marks: [
                    Plot.line(data_sales_over_time, {
                        x: "date",
                        y: "sales",
                        stroke: "#bd93f9",
                        strokeWidth: 2,
                        tip: true
                    }),
                    Plot.dot(data_sales_over_time, {
                        x: "date",
                        y: "sales",
                        fill: "#bd93f9",
                        r: 4
                    }),
                    Plot.ruleY([0])
                ],
                x: { type: "utc" },
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-trends-sales_over_time').appendChild(plot_sales_over_time);
            // Chart: average_sales_trend
            const data_average_sales_trend = d3.rollups(
                dashmlData,
                v => d3.mean(v, d => d['sales']),
                d => d['date']
            ).map(([date, sales]) => ({ date, sales }));
            const plot_average_sales_trend = Plot.plot({
                marks: [
                    Plot.line(data_average_sales_trend, {
                        x: "date",
                        y: "sales",
                        stroke: "#bd93f9",
                        strokeWidth: 2,
                        tip: true
                    }),
                    Plot.dot(data_average_sales_trend, {
                        x: "date",
                        y: "sales",
                        fill: "#bd93f9",
                        r: 4
                    }),
                    Plot.ruleY([0])
                ],
                x: { type: "utc" },
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-trends-average_sales_trend').appendChild(plot_average_sales_trend);
            // Chart: sales_count_by_country
            const data_sales_count_by_country = d3.rollups(
                dashmlData,
                v => v.length,
                d => d['country']
            ).map(([country, sales]) => ({ country, sales }));
            const plot_sales_count_by_country = Plot.plot({
                marks: [
                    Plot.barY(data_sales_count_by_country, {
                        x: "country",
                        y: "sales",
                        fill: "#bd93f9",
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-detailed-sales_count_by_country').appendChild(plot_sales_count_by_country);
            // Chart: sales_scatter
            const data_sales_scatter = d3.rollups(
                dashmlData,
                v => d3.mean(v, d => d['sales']),
                d => d['date']
            ).map(([date, sales]) => ({ date, sales }));
            const plot_sales_scatter = Plot.plot({
                marks: [
                    Plot.dot(data_sales_scatter, {
                        x: "date",
                        y: "sales",
                        fill: "#bd93f9",
                        r: 5,
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                x: { type: "utc" },
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-detailed-sales_scatter').appendChild(plot_sales_scatter);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashML Plotly Demo</title>
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <!-- js-yaml for YAML parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    
    <!-- DashML Core & Plotly Renderer -->
    <script src="js/dashml.js"></script>
    <script src="js/dashml-plotly.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .controls {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .controls label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .controls input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .controls input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        #dashboard {
            margin-top: 30px;
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 DashML <span class="badge">v0.000000001</span></h1>
            <p>Declarative Dashboard Language - Plotly.js Transformer</p>
        </header>
        
        <div class="controls">
            <label for="dashmlPath">DashML Spec File:</label>
            <input 
                type="text" 
                id="dashmlPath" 
                value="dashml_example.yaml" 
                placeholder="path/to/dashml.yaml"
            >
            <button onclick="loadDashboard()">Load Dashboard</button>
        </div>
        
        <div id="dashboard"></div>
        
        <footer>
            <p>🚀 Powered by DashML | Built for AGH Thesis Project</p>
            <p>Dawid Olejniczak & Szymon Nowaczyk | 2025/2026</p>
        </footer>
    </div>
    
    <script>
        async function loadDashboard() {
            const dashmlPath = document.getElementById('dashmlPath').value;
            const dashboardDiv = document.getElementById('dashboard');
            
            dashboardDiv.innerHTML = '<div class="loading">⏳ Loading dashboard...</div>';
            
            try {
                const transformer = await DashMLTransformer.fromYAML(dashmlPath);
                const renderer = new DashMLPlotlyRenderer(transformer);
                
                await renderer.renderDashboard({
                    containerId: 'dashboard',
                    showTitle: true,
                    showSelector: true
                });
            } catch (error) {
                dashboardDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                    </div>
                `;
                console.error('DashML Error:', error);
            }
        }
        
        // Auto-load on page load
        window.addEventListener('DOMContentLoaded', loadDashboard);
        
        // Allow Enter key to load
        document.getElementById('dashmlPath').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loadDashboard();
        });
    </script>
</body>
</html>

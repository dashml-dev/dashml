<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Chart Types Demo</title>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #282a36;
      color: #f8f8f2;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #282a36;
      padding: 0;
    }
    .card {
      background-color: #313343;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(255,255,255,0.1);
      margin-bottom: 20px;
    }
    h1 {
      margin-top: 0;
      color: #f8f8f2;
    }
    #chart {
      margin-top: 20px;
      min-height: 500px;
    }
    .chart-selector {
      margin: 20px 0;
    }
    select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #313343;
      color: #f8f8f2;
    }
    label {
      margin-right: 10px;
      font-weight: 500;
      color: #f8f8f2;
    }
    .page-tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      border-bottom: 2px solid #f8f8f240; /* 40 = 25% opacity hex */
      padding-bottom: 0;
    }
    .tab-button {
      padding: 10px 20px;
      background-color: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #f8f8f2;
      opacity: 0.7;
      transition: all 0.2s;
    }
    .tab-button:hover {
      opacity: 1;
      background-color: #f8f8f210; /* 10 = ~6% opacity */
    }
    .tab-button.active {
      color: #bd93f9;
      border-bottom-color: #bd93f9;
      opacity: 1;
    }
    .page-container {
      margin-top: 20px;
    }
    .page-description {
      color: #f8f8f2;
      opacity: 0.8;
      margin-bottom: 20px;
    }
    .chart-container {
      margin: 20px 0;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>New Chart Types Demo</h1>
    <div class="page-tabs">
      <button class="tab-button active" onclick="showPage('basic', this)">📊 Basic Charts</button>
      <button class="tab-button" onclick="showPage('new', this)">✨ New Chart Types</button>
      <button class="tab-button" onclick="showPage('advanced', this)">📊 Advanced Charts</button>
    </div>
    <div id="page-basic" class="page-container">
      <p class="page-description"><em>Original chart types (bar, line, scatter, pie)</em></p>
      <div class="card">
        <div id="chart-bar_example"></div>
      </div>
      <div class="card">
        <div id="chart-line_example"></div>
      </div>
    </div>
    <div id="page-new" class="page-container" style="display:none">
      <p class="page-description"><em>Priority 1 additions (area, histogram)</em></p>
      <div class="card">
        <div id="chart-area_example"></div>
      </div>
      <div class="card">
        <div id="chart-histogram_example"></div>
      </div>
    </div>
    <div id="page-advanced" class="page-container" style="display:none">
      <p class="page-description"><em>Stacked and grouped bar charts</em></p>
      <div class="card">
        <div id="chart-stacked_example"></div>
      </div>
      <div class="card">
        <div id="chart-grouped_example"></div>
      </div>
    </div>
  </div>
  <script>
    const theme = {"background": "#282a36", "card": "#313343", "text": "#f8f8f2", "primary": "#bd93f9", "secondary": ["#50fa7b", "#ffb86c", "#ff5555", "#8be9fd", "#f1fa8c"]};

    function aggregateData(data, xCol, yCol, aggFunc, xType) {
      const groups = {};
      data.forEach(row => {
        const key = row[xCol];
        if (!groups[key]) groups[key] = [];
        groups[key].push(parseFloat(row[yCol]) || 0);
      });

      const result = Object.entries(groups).map(([key, values]) => {
        let aggValue;
        switch (aggFunc) {
          case 'mean': aggValue = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggValue = values.length; break;
          default: aggValue = values.reduce((a, b) => a + b, 0);
        }
        return { [xCol]: key, [yCol]: aggValue };
      });

      // Sort based on x_type (explicit) or default string sort
      if (xType === 'date') {
        result.sort((a, b) => new Date(a[xCol]) - new Date(b[xCol]));
      } else if (xType === 'number') {
        result.sort((a, b) => parseFloat(a[xCol]) - parseFloat(b[xCol]));
      }
      // No sort for 'string' or undefined - keep aggregation order

      return result;
    }

    function aggregateDataWithGroup(data, x, y, groupField, agg, xType) {
      const grouped = {};
      data.forEach(row => {
        const xKey = row[x];
        const groupKey = row[groupField];
        const compositeKey = xKey + '|||' + groupKey;
        if (!grouped[compositeKey]) grouped[compositeKey] = { x: xKey, group: groupKey, values: [], count: 0 };
        grouped[compositeKey].values.push(parseFloat(row[y]) || 0);
        grouped[compositeKey].count++;
      });

      const result = [];
      Object.keys(grouped).forEach(key => {
        const entry = grouped[key];
        const values = entry.values;
        let aggregated;
        switch (agg) {
          case 'sum': aggregated = values.reduce((a, b) => a + b, 0); break;
          case 'mean': aggregated = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggregated = entry.count; break;
          default: aggregated = values.reduce((a, b) => a + b, 0);
        }
        result.push({ x: entry.x, group: entry.group, y: aggregated });
      });

      // Sort based on x_type
      if (xType === 'date') {
        result.sort((a, b) => new Date(a.x) - new Date(b.x));
      } else if (xType === 'number') {
        result.sort((a, b) => parseFloat(a.x) - parseFloat(b.x));
      }

      return result;
    }


    function render_bar_example(data) {
      const grouped = aggregateData(data, 'country', 'sales', 'sum', undefined);
      const xValues = grouped.map(d => d.country);
      const yValues = grouped.map(d => d.sales);

      let trace;
      switch ('bar') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Bar Chart', font: { color: theme.text } },
        xaxis: { title: 'country', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-bar_example', [trace], layout, { responsive: true });
    }
    function render_line_example(data) {
      const grouped = aggregateData(data, 'date', 'sales', 'sum', undefined);
      const xValues = grouped.map(d => d.date);
      const yValues = grouped.map(d => d.sales);

      let trace;
      switch ('line') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Line Chart', font: { color: theme.text } },
        xaxis: { title: 'date', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-line_example', [trace], layout, { responsive: true });
    }
    function render_area_example(data) {
      const grouped = aggregateData(data, 'date', 'sales', 'sum', undefined);
      const xValues = grouped.map(d => d.date);
      const yValues = grouped.map(d => d.sales);

      let trace;
      switch ('area') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Area Chart - Sales Over Time', font: { color: theme.text } },
        xaxis: { title: 'date', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-area_example', [trace], layout, { responsive: true });
    }
    function render_histogram_example(data) {
      // Use raw data for histogram
      const xValues = data.map(d => d['sales']);
      const yValues = data.map(d => d['sales']);

      let trace;
      switch ('histogram') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Histogram - Sales Distribution', font: { color: theme.text } },
        xaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-histogram_example', [trace], layout, { responsive: true });
    }
    function render_stacked_example(data) {
      // Stacked/grouped bars need multiple traces
      const aggregated = aggregateDataWithGroup(data, 'country', 'sales', 'product', 'sum', undefined);
      const groupValues = [...new Set(aggregated.map(d => d.group))];

      const traces = [];
      groupValues.forEach((groupVal, idx) => {
        const filtered = aggregated.filter(d => d.group === groupVal);
        traces.push({
          x: filtered.map(d => d.x),
          y: filtered.map(d => d.y),
          name: groupVal,
          type: 'bar',
          marker: { color: theme.secondary[idx % theme.secondary.length] }
        });
      });

      const layout = {
        title: { text: 'Stacked Bar - Sales by Country and Product', font: { color: theme.text } },
        xaxis: { title: 'country', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        barmode: 'stack',
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-stacked_example', traces, layout, { responsive: true });
    }
    function render_grouped_example(data) {
      // Stacked/grouped bars need multiple traces
      const aggregated = aggregateDataWithGroup(data, 'country', 'sales', 'product', 'sum', undefined);
      const groupValues = [...new Set(aggregated.map(d => d.group))];

      const traces = [];
      groupValues.forEach((groupVal, idx) => {
        const filtered = aggregated.filter(d => d.group === groupVal);
        traces.push({
          x: filtered.map(d => d.x),
          y: filtered.map(d => d.y),
          name: groupVal,
          type: 'bar',
          marker: { color: theme.secondary[idx % theme.secondary.length] }
        });
      });

      const layout = {
        title: { text: 'Grouped Bar - Sales by Country and Product', font: { color: theme.text } },
        xaxis: { title: 'country', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'sales', color: theme.text, gridcolor: theme.text + '20' },
        barmode: 'group',
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-grouped_example', traces, layout, { responsive: true });
    }


    function showPage(pageId, clickedButton) {
      document.querySelectorAll('.page-container').forEach(page => {
        page.style.display = 'none';
      });
      document.querySelectorAll('.tab-button').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById('page-' + pageId).style.display = 'block';
      if (clickedButton) {
        clickedButton.classList.add('active');
      }
    }


    function renderAllPages(data) {
      render_bar_example(data);
      render_line_example(data);
      render_area_example(data);
      render_histogram_example(data);
      render_stacked_example(data);
      render_grouped_example(data);
    }

    fetch('data/example.csv')
      .then(response => response.text())
      .then(csv => {
        const lines = csv.trim().split('\n').filter(line => line.trim());
        const headers = lines[0].split(',').map(h => h.trim());
        const data = lines.slice(1)
          .map(line => {
            const values = line.split(',');
            if (values.length !== headers.length) return null;
            const row = {};
            headers.forEach((header, i) => {
              row[header] = values[i] ? values[i].trim() : '';
            });
            return row;
          })
          .filter(row => row !== null);

        renderAllPages(data);
      })
      .catch(error => console.error('Error loading data:', error));
  </script>
</body>
</html>

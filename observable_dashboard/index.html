<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, sans-serif;
            background-color: #282a36;
            color: #f8f8f2;
            padding: 2rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .card {
            margin-bottom: 3rem;
            background: #313343;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .page-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: #f8f8f2;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        .tab-button.active {
            opacity: 1;
            border-bottom-color: #bd93f9;
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        .page-description {
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        /* Observable Plot chart styling */
        svg {
            background: transparent;
        }
    </style>
</head>
<body>
    <h1>Sales Analytics Dashboard</h1>

    <script>
        // Column types from INFORMATION_SCHEMA (auto-detected)
        let columnTypes = {};
        // Load data from Flask API
        let dashmlData = [];

        // Get effective type: explicit > schema-detected > undefined
        function getEffectiveType(column, explicitType) {
            if (explicitType) return explicitType;
            return columnTypes[column] || undefined;
        }

        // Fetch schema first, then data
        Promise.all([
            fetch('/api/schema').then(r => r.json()),
            fetch('/api/data').then(r => r.json())
        ])
            .then(([schema, data]) => {
                columnTypes = schema;

                // Parse ISO 8601 date strings to Date objects
                // Server already cast types, we just need to parse ISO dates
                dashmlData = data.map(row => {
                    const parsedRow = {};
                    for (const [column, value] of Object.entries(row)) {
                        if (columnTypes[column] === 'date' && value !== null) {
                            // Parse ISO 8601 date string (e.g., "2023-01-05T00:00:00.000Z")
                            parsedRow[column] = new Date(value);
                        } else {
                            // Numbers are already parsed by JSON, strings stay as strings
                            parsedRow[column] = value;
                        }
                    }
                    return parsedRow;
                });

                console.log('Column types from INFORMATION_SCHEMA:', columnTypes);
                console.log('Parsed data (first row):', dashmlData[0]);
                renderAllCharts();
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.body.innerHTML += '<p style="color: red;">Error loading data from database</p>';
            });
    </script>
    <div class="page-tabs">
        <button class="tab-button active" onclick="showPage('overview', this)">📊 Overview</button>
        <button class="tab-button" onclick="showPage('trends', this)">📈 Trends</button>
    </div>
    <div id="page-overview" class="page-content active">
        <p class="page-description">High-level sales metrics and KPIs</p>
        <div class="card">
            <h2>Total Sales by State</h2>
            <div id="chart-overview-total_sales_by_country"></div>
        </div>
        <div class="card">
            <h2>Market Share by State</h2>
            <div id="chart-overview-country_sales_breakdown"></div>
        </div>
    </div>
    <div id="page-trends" class="page-content">
        <p class="page-description">Sales trends and patterns over time</p>
        <div class="card">
            <h2>Sales Over Time</h2>
            <div id="chart-trends-sales_over_time"></div>
        </div>
        <div class="card">
            <h2>Average Daily Sales</h2>
            <div id="chart-trends-average_sales_trend"></div>
        </div>
    </div>
    <script>
        function showPage(pageId, buttonElement) {
            // Hide all pages
            document.querySelectorAll('.page-content').forEach(page => {
                page.classList.remove('active');
            });

            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show selected page
            document.getElementById('page-' + pageId).classList.add('active');
            buttonElement.classList.add('active');
        }

        function renderAllCharts() {
            // Chart: total_sales_by_country
            const data_total_sales_by_country = (() => {
                const effectiveXType = getEffectiveType('shipping_address_state', undefined);
                const result = d3.rollups(
                    dashmlData,
                    v => d3.sum(v, d => d['total_amount']),
                    d => d['shipping_address_state']
                ).map(([shipping_address_state, total_amount]) => ({ shipping_address_state, total_amount }));

                // TODO: [DEBUG] Remove this logging after fixing spaghetti chart issue
                console.log('BEFORE SORT - effectiveXType:', effectiveXType);
                console.log('BEFORE SORT - first 5 values:', result.slice(0, 5).map(d => d.shipping_address_state));

                // Sort based on effective x_type
                if (effectiveXType === 'date') {
                    result.sort((a, b) => new Date(a.shipping_address_state) - new Date(b.shipping_address_state));
                } else if (effectiveXType === 'number') {
                    result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                } else {
                    // Fallback: detect runtime type from first value
                    if (result.length > 0) {
                        const firstVal = result[0].shipping_address_state;
                        console.log('RUNTIME TYPE DETECTION - firstVal:', firstVal, 'type:', typeof firstVal, 'isDate:', firstVal instanceof Date);
                        if (firstVal instanceof Date) {
                            result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                        } else if (typeof firstVal === 'number') {
                            result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                        } else {
                            result.sort((a, b) => String(a.shipping_address_state).localeCompare(String(b.shipping_address_state)));
                        }
                    }
                }

                console.log('AFTER SORT - first 5 values:', result.slice(0, 5).map(d => d.shipping_address_state));
                console.log('AFTER SORT - last 5 values:', result.slice(-5).map(d => d.shipping_address_state));
                return result;
            })();
            const plot_total_sales_by_country = Plot.plot({
                marks: [
                    Plot.barY(data_total_sales_by_country, {
                        x: "shipping_address_state",
                        y: "total_amount",
                        fill: "#bd93f9",
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-total_sales_by_country').appendChild(plot_total_sales_by_country);
            // D3 Pie Chart
            const data_country_sales_breakdown = (() => {
                const effectiveXType = getEffectiveType('shipping_address_state', undefined);
                const result = d3.rollups(
                    dashmlData,
                    v => d3.sum(v, d => d['total_amount']),
                    d => d['shipping_address_state']
                ).map(([shipping_address_state, total_amount]) => ({ shipping_address_state, total_amount }));

                // TODO: [DEBUG] Remove this logging after fixing spaghetti chart issue
                console.log('BEFORE SORT - effectiveXType:', effectiveXType);
                console.log('BEFORE SORT - first 5 values:', result.slice(0, 5).map(d => d.shipping_address_state));

                // Sort based on effective x_type
                if (effectiveXType === 'date') {
                    result.sort((a, b) => new Date(a.shipping_address_state) - new Date(b.shipping_address_state));
                } else if (effectiveXType === 'number') {
                    result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                } else {
                    // Fallback: detect runtime type from first value
                    if (result.length > 0) {
                        const firstVal = result[0].shipping_address_state;
                        console.log('RUNTIME TYPE DETECTION - firstVal:', firstVal, 'type:', typeof firstVal, 'isDate:', firstVal instanceof Date);
                        if (firstVal instanceof Date) {
                            result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                        } else if (typeof firstVal === 'number') {
                            result.sort((a, b) => a.shipping_address_state - b.shipping_address_state);
                        } else {
                            result.sort((a, b) => String(a.shipping_address_state).localeCompare(String(b.shipping_address_state)));
                        }
                    }
                }

                console.log('AFTER SORT - first 5 values:', result.slice(0, 5).map(d => d.shipping_address_state));
                console.log('AFTER SORT - last 5 values:', result.slice(-5).map(d => d.shipping_address_state));
                return result;
            })();
            const pieWidth = 400;
            const pieHeight = 400;
            const legendWidth = 150;
            const totalWidth = pieWidth + legendWidth;
            const radius = Math.min(pieWidth, pieHeight) / 2 - 10;

            const pie = d3.pie().value(d => d.total_amount);
            const arc = d3.arc().innerRadius(0).outerRadius(radius);

            // Use theme secondary colors for categorical data
            const themeColors = ['#50fa7b', '#ffb86c', '#ff5555', '#8be9fd', '#f1fa8c'];
            const color = d3.scaleOrdinal()
                .domain(data_country_sales_breakdown.map(d => d.shipping_address_state))
                .range(themeColors);

            const svg = d3.create("svg")
                .attr("width", totalWidth)
                .attr("height", pieHeight)
                .attr("viewBox", [0, 0, totalWidth, pieHeight])
                .attr("style", "max-width: 100%; height: auto;");

            // Pie chart group (centered in left portion)
            const pieGroup = svg.append("g")
                .attr("transform", `translate(${pieWidth / 2}, ${pieHeight / 2})`);

            pieGroup.selectAll("path")
                .data(pie(data_country_sales_breakdown))
                .join("path")
                .attr("fill", d => color(d.data.shipping_address_state))
                .attr("d", arc)
                .attr("stroke", "white")
                .attr("stroke-width", 2)
                .append("title")
                .text(d => `${d.data.shipping_address_state}: ${d.data.total_amount}`);

            // Legend (positioned on the right)
            const legend = svg.append("g")
                .attr("transform", `translate(${pieWidth + 10}, 20)`);

            data_country_sales_breakdown.forEach((d, i) => {
                const legendRow = legend.append("g")
                    .attr("transform", `translate(0, ${i * 25})`);

                legendRow.append("rect")
                    .attr("width", 15)
                    .attr("height", 15)
                    .attr("fill", color(d.shipping_address_state))
                    .attr("rx", 2);

                legendRow.append("text")
                    .attr("x", 22)
                    .attr("y", 12)
                    .attr("fill", "#f8f8f2")
                    .style("font-size", "13px")
                    .text(d.shipping_address_state);
            });

            document.getElementById('chart-overview-country_sales_breakdown').appendChild(svg.node());
            // Chart: sales_over_time
            const data_sales_over_time = (() => {
                const effectiveXType = getEffectiveType('order_date', undefined);
                const result = d3.rollups(
                    dashmlData,
                    v => d3.sum(v, d => d['total_amount']),
                    d => d['order_date']
                ).map(([order_date, total_amount]) => ({ order_date, total_amount }));

                // TODO: [DEBUG] Remove this logging after fixing spaghetti chart issue
                console.log('BEFORE SORT - effectiveXType:', effectiveXType);
                console.log('BEFORE SORT - first 5 values:', result.slice(0, 5).map(d => d.order_date));

                // Sort based on effective x_type
                if (effectiveXType === 'date') {
                    result.sort((a, b) => new Date(a.order_date) - new Date(b.order_date));
                } else if (effectiveXType === 'number') {
                    result.sort((a, b) => a.order_date - b.order_date);
                } else {
                    // Fallback: detect runtime type from first value
                    if (result.length > 0) {
                        const firstVal = result[0].order_date;
                        console.log('RUNTIME TYPE DETECTION - firstVal:', firstVal, 'type:', typeof firstVal, 'isDate:', firstVal instanceof Date);
                        if (firstVal instanceof Date) {
                            result.sort((a, b) => a.order_date - b.order_date);
                        } else if (typeof firstVal === 'number') {
                            result.sort((a, b) => a.order_date - b.order_date);
                        } else {
                            result.sort((a, b) => String(a.order_date).localeCompare(String(b.order_date)));
                        }
                    }
                }

                console.log('AFTER SORT - first 5 values:', result.slice(0, 5).map(d => d.order_date));
                console.log('AFTER SORT - last 5 values:', result.slice(-5).map(d => d.order_date));
                return result;
            })();
            const plot_sales_over_time = Plot.plot({
                marks: [
                    Plot.line(data_sales_over_time, {
                        x: "order_date",
                        y: "total_amount",
                        stroke: "#bd93f9",
                        strokeWidth: 2,
                        sort: "order_date",
                        tip: true
                    }),
                    Plot.dot(data_sales_over_time, {
                        x: "order_date",
                        y: "total_amount",
                        fill: "#bd93f9",
                        r: 4
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-trends-sales_over_time').appendChild(plot_sales_over_time);
            // Chart: average_sales_trend
            const data_average_sales_trend = (() => {
                const effectiveXType = getEffectiveType('order_date', undefined);
                const result = d3.rollups(
                    dashmlData,
                    v => d3.mean(v, d => d['total_amount']),
                    d => d['order_date']
                ).map(([order_date, total_amount]) => ({ order_date, total_amount }));

                // TODO: [DEBUG] Remove this logging after fixing spaghetti chart issue
                console.log('BEFORE SORT - effectiveXType:', effectiveXType);
                console.log('BEFORE SORT - first 5 values:', result.slice(0, 5).map(d => d.order_date));

                // Sort based on effective x_type
                if (effectiveXType === 'date') {
                    result.sort((a, b) => new Date(a.order_date) - new Date(b.order_date));
                } else if (effectiveXType === 'number') {
                    result.sort((a, b) => a.order_date - b.order_date);
                } else {
                    // Fallback: detect runtime type from first value
                    if (result.length > 0) {
                        const firstVal = result[0].order_date;
                        console.log('RUNTIME TYPE DETECTION - firstVal:', firstVal, 'type:', typeof firstVal, 'isDate:', firstVal instanceof Date);
                        if (firstVal instanceof Date) {
                            result.sort((a, b) => a.order_date - b.order_date);
                        } else if (typeof firstVal === 'number') {
                            result.sort((a, b) => a.order_date - b.order_date);
                        } else {
                            result.sort((a, b) => String(a.order_date).localeCompare(String(b.order_date)));
                        }
                    }
                }

                console.log('AFTER SORT - first 5 values:', result.slice(0, 5).map(d => d.order_date));
                console.log('AFTER SORT - last 5 values:', result.slice(-5).map(d => d.order_date));
                return result;
            })();
            const plot_average_sales_trend = Plot.plot({
                marks: [
                    Plot.line(data_average_sales_trend, {
                        x: "order_date",
                        y: "total_amount",
                        stroke: "#bd93f9",
                        strokeWidth: 2,
                        sort: "order_date",
                        tip: true
                    }),
                    Plot.dot(data_average_sales_trend, {
                        x: "order_date",
                        y: "total_amount",
                        fill: "#bd93f9",
                        r: 4
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-trends-average_sales_trend').appendChild(plot_average_sales_trend);
        }
    </script>
</body>
</html>

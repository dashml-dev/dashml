<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashML Example Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f7fa;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #2c3e50;
        }
        .chart-container {
            margin: 30px 0;
            height: 500px;
        }
        select {
            padding: 8px 16px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DashML Example Dashboard</h1>
        <select id="chartSelector"></select>
        <div id="chart" class="chart-container"></div>
    </div>
    
    <script>
        // IR from DashML compiler
        const IR = {
  "version": 1e-09,
  "title": "DashML Example Dashboard",
  "datasets": {
    "default": {
      "id": "default",
      "type": "csv",
      "source": "data/example.csv",
      "query": null
    }
  },
  "charts": [
    {
      "id": "sales_by_country",
      "type": "line",
      "title": "Sales by country",
      "datasetId": "default",
      "x": {
        "column": "country",
        "type": "string"
      },
      "y": {
        "column": "sales",
        "aggregation": "sum"
      },
      "filters": [],
      "color": null
    },
    {
      "id": "sales_over_time",
      "type": "line",
      "title": "Sales over time",
      "datasetId": "default",
      "x": {
        "column": "date",
        "type": "string"
      },
      "y": {
        "column": "sales",
        "aggregation": "sum"
      },
      "filters": [],
      "color": null
    }
  ],
  "filters": []
};
        
        // Data cache (browser fetches and caches)
        const dataCache = {};
        
        // Load data (browser responsibility!)
        async function loadData(datasetId) {
            if (dataCache[datasetId]) return dataCache[datasetId];
            
            const dataset = IR.datasets[datasetId];
            
            if (dataset.type === 'csv') {
                const response = await fetch(dataset.source);
                const csvText = await response.text();
                const data = parseCSV(csvText);
                dataCache[datasetId] = data;
                return data;
            } else {
                throw new Error(`Dataset type ${dataset.type} not yet supported in browser`);
            }
        }
        
        // Simple CSV parser
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const rows = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                const row = {};
                headers.forEach((header, index) => {
                    const value = values[index];
                    row[header] = isNaN(value) ? value : parseFloat(value);
                });
                rows.push(row);
            }
            
            return rows;
        }
        
        // Aggregate data (browser responsibility!)
        function aggregateData(data, xCol, yCol, aggFunc) {
            const grouped = {};
            
            data.forEach(row => {
                const key = row[xCol];
                if (!grouped[key]) {
                    grouped[key] = { values: [], count: 0 };
                }
                grouped[key].values.push(row[yCol]);
                grouped[key].count++;
            });
            
            const result = [];
            Object.keys(grouped).forEach(key => {
                const values = grouped[key].values;
                let aggregated;
                
                switch(aggFunc) {
                    case 'sum':
                        aggregated = values.reduce((a, b) => a + b, 0);
                        break;
                    case 'mean':
                        aggregated = values.reduce((a, b) => a + b, 0) / values.length;
                        break;
                    case 'count':
                        aggregated = grouped[key].count;
                        break;
                    default:
                        aggregated = values.reduce((a, b) => a + b, 0);
                }
                
                result.push({ [xCol]: key, [yCol]: aggregated });
            });
            
            return result;
        }
        
        // Render chart
        async function renderChart(chartId) {
            const chart = IR.charts.find(c => c.id === chartId);
            if (!chart) return;
            
            // Load data (browser fetches!)
            const rawData = await loadData(chart.datasetId);
            
            // Apply filters
            let filteredData = rawData;
            chart.filters.forEach(filter => {
                filteredData = filteredData.filter(row => {
                    // Simple filter implementation
                    return row[filter.column] === filter.value;
                });
            });
            
            // Aggregate data (browser computes!)
            const aggregated = aggregateData(
                filteredData,
                chart.x.column,
                chart.y.column,
                chart.y.aggregation
            );
            
            // Prepare Plotly data
            const xValues = aggregated.map(row => row[chart.x.column]);
            const yValues = aggregated.map(row => row[chart.y.column]);
            
            const trace = {
                x: xValues,
                y: yValues,
                type: chart.type === 'line' ? 'scatter' : chart.type,
                mode: chart.type === 'line' ? 'lines+markers' : undefined
            };
            
            const layout = {
                title: chart.title,
                xaxis: { title: chart.x.column },
                yaxis: { title: chart.y.column }
            };
            
            Plotly.newPlot('chart', [trace], layout);
        }
        
        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            const selector = document.getElementById('chartSelector');
            
            // Populate chart selector
            IR.charts.forEach(chart => {
                const option = document.createElement('option');
                option.value = chart.id;
                option.textContent = chart.title;
                selector.appendChild(option);
            });
            
            // Render first chart
            if (IR.charts.length > 0) {
                renderChart(IR.charts[0].id);
            }
            
            // Handle selection change
            selector.addEventListener('change', (e) => {
                renderChart(e.target.value);
            });
        });
    </script>
</body>
</html>

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dashml"
version = "0.1.0"
description = "Declarative YAML-based compiler for data visualization dashboards"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
streamlit = [
    "streamlit>=1.40.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
    "watchdog>=4.0.0",
]
sql = [
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
bigquery = [
    "flask>=3.0.0",
    "google-cloud-bigquery>=3.0.0",
]
superset = [
    "requests>=2.32.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dashml = "dashml_new.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dashml_new*"]

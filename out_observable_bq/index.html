    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, sans-serif;
            background-color: #282a36;
            color: #f8f8f2;
            padding: 2rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .card {
            margin-bottom: 3rem;
            background: #313343;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .page-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: #f8f8f2;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        .tab-button.active {
            opacity: 1;
            border-bottom-color: #bd93f9;
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        .page-description {
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        /* Observable Plot chart styling */
        svg {
            background: transparent;
        }

        .chart-spinner {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 300px; gap: 12px;
            color: #f8f8f2; opacity: 0.6;
        }
        .chart-spinner .spinner {
            width: 40px; height: 40px;
            border: 3px solid #f8f8f220;
            border-top-color: #bd93f9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .chart-error {
            display: flex; align-items: center; justify-content: center;
            min-height: 300px; color: #e74c3c;
        }
        .metric-card {
            text-align: center;
            padding: 24px 20px;
            min-width: 160px;
            display: inline-block;
        }
        .metric-title {
            font-size: 13px;
            color: #f8f8f2;
            opacity: 0.65;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }
        .metric-value {
            font-size: 2.6rem;
            font-weight: 700;
            color: #bd93f9;
            line-height: 1.1;
        }
    </style>
</head>

    <script>
        // World topojson for geo charts
        window.worldTopojson = null;

        // Load world topojson once
        fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
            .then(r => r.json())
            .then(worldData => {
                window.worldTopojson = topojson.feature(worldData, worldData.objects.countries);
            })
            .catch(err => console.warn('Could not load world topojson:', err));

        // Format a metric scalar value
        function formatMetric(value, format, suffix) {
            if (value === null || value === undefined || isNaN(value)) return 'N/A';
            const n = parseFloat(value);
            const m = format.match(/,?\.(\d+)f/);
            const decimals = m ? parseInt(m[1]) : 0;
            const str = n.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
            return str + (suffix || '');
        }

        async function loadChart(containerId, chartId, renderFn, extraParams) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '<div class="chart-spinner"><div class="spinner"></div><span>Loading...</span></div>';
            try {
                const url = '/api/chart/' + chartId + (extraParams ? '?' + extraParams : '');
                const resp = await fetch(url);
                if (!resp.ok) {
                    const body = await resp.json().catch(() => ({}));
                    throw new Error(body.error || 'HTTP ' + resp.status);
                }
                const data = await resp.json();
                container.innerHTML = '';
                renderFn(data);
            } catch (err) {
                container.innerHTML = '<div class="chart-error">Error loading chart: ' + err.message + '</div>';
                console.error('Chart ' + chartId + ' failed:', err);
            }
        }

        async function loadMetric(containerId, chartId, renderFn, extraParams) {
            const el = document.getElementById(containerId);
            if (!el) return;
            el.textContent = '…';
            try {
                const url = '/api/chart/' + chartId + (extraParams ? '?' + extraParams : '');
                const resp = await fetch(url);
                if (!resp.ok) {
                    const body = await resp.json().catch(() => ({}));
                    throw new Error(body.error || 'HTTP ' + resp.status);
                }
                const data = await resp.json();
                renderFn(data);
            } catch (err) {
                if (el) el.textContent = 'Error';
                console.error('Metric ' + chartId + ' failed:', err);
            }
        }
    </script>

        function detectGeoEncoding(values) {
            const sample = values.filter(v => v != null && v !== '').slice(0, 20);
            if (sample.every(v => /^[A-Z]{2}$/.test(String(v)))) return 'iso2';
            if (sample.every(v => /^[A-Z]{3}$/.test(String(v)))) return 'iso3';
            return 'name';
        }
        function normalizeCountryToTopo(value, encoding) {
            const v = String(value).trim();
            if (!v) return v;
            if (encoding === 'iso2') return iso2ToTopo[v.toUpperCase()] || v;
            if (encoding === 'iso3') return iso3ToTopo[v.toUpperCase()] || v;
            return aliasToTopo[v.toLowerCase()] || v;
        }
        const PAGE_CHARTS = {};

        function toggleMs(btn, pageId, field) {
            const panel = document.getElementById('ms-panel-' + pageId + '-' + field);
            const isOpen = panel.classList.contains('ms-open');
            closeAllMs();
            if (!isOpen) { panel.classList.add('ms-open'); btn.classList.add('ms-open'); }
        }
        function closeAllMs() {
            document.querySelectorAll('.ms-panel.ms-open').forEach(p => p.classList.remove('ms-open'));
            document.querySelectorAll('.ms-btn.ms-open').forEach(b => b.classList.remove('ms-open'));
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.ms-wrap')) closeAllMs();
        });
        function updateMsLabel(pageId, field) {
            const panel = document.getElementById('ms-panel-' + pageId + '-' + field);
            const countEl = document.getElementById('ms-count-' + pageId + '-' + field);
            const textEl = document.querySelector('#ms-' + pageId + '-' + field + ' .ms-text');
            if (!panel || !countEl || !textEl) return;
            const checked = Array.from(panel.querySelectorAll('input[type="checkbox"]:checked'));
            const n = checked.length;
            if (n === 0) {
                textEl.textContent = 'All';
                countEl.textContent = ''; countEl.classList.remove('visible');
            } else if (n === 1) {
                textEl.textContent = checked[0].value;
                countEl.textContent = ''; countEl.classList.remove('visible');
            } else {
                textEl.textContent = checked[0].value;
                countEl.textContent = '+' + (n - 1); countEl.classList.add('visible');
            }
        }
        function collectFilterParams(pageId) {
            const pageInfo = PAGE_CHARTS[pageId];
            if (!pageInfo) return '';
            const params = new URLSearchParams();
            for (const field of pageInfo.filter_fields) {
                const sel = document.getElementById('filter-' + pageId + '-' + field);
                if (sel) {
                    if (sel.value) params.append(field, sel.value);
                } else {
                    const panel = document.getElementById('ms-panel-' + pageId + '-' + field);
                    if (panel) panel.querySelectorAll('input[type="checkbox"]:checked').forEach(cb => params.append(field, cb.value));
                }
            }
            return params.toString();
        }
        function applyDashboardFilter(pageId) {
            const pageInfo = PAGE_CHARTS[pageId];
            if (!pageInfo) return;
            const params = collectFilterParams(pageId);
            pageInfo.charts.forEach(chartId => {
                const containerId = 'chart-' + pageId + '-' + chartId;
                if (window['renderFn_' + chartId]) {
                    loadChart(containerId, chartId, window['renderFn_' + chartId], params);
                }
            });
            pageInfo.metrics.forEach(chartId => {
                const containerId = 'chart-' + pageId + '-' + chartId;
                if (window['renderFn_' + chartId]) {
                    loadMetric(containerId, chartId, window['renderFn_' + chartId], params);
                }
            });
        }
        function resetFilters(pageId) {
            const pageInfo = PAGE_CHARTS[pageId];
            if (!pageInfo) return;
            for (const field of pageInfo.filter_fields) {
                const sel = document.getElementById('filter-' + pageId + '-' + field);
                if (sel) { sel.value = ''; } else {
                    const panel = document.getElementById('ms-panel-' + pageId + '-' + field);
                    if (panel) { panel.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false); updateMsLabel(pageId, field); }
                }
            }
            applyDashboardFilter(pageId);
        }
        function loadFilterOptions(pageId) {
            const pageInfo = PAGE_CHARTS[pageId];
            if (!pageInfo) return;
            for (const field of pageInfo.filter_fields) {
                const isSel = !!document.getElementById('filter-' + pageId + '-' + field);
                fetch('/api/filter/' + field)
                    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                    .then(values => {
                        if (isSel) {
                            const sel = document.getElementById('filter-' + pageId + '-' + field);
                            if (!sel) return;
                            values.forEach(v => {
                                const opt = document.createElement('option');
                                opt.value = v; opt.textContent = v; sel.appendChild(opt);
                            });
                        } else {
                            const panel = document.getElementById('ms-panel-' + pageId + '-' + field);
                            if (!panel) return;
                            panel.innerHTML = values.map(v =>
                                `<label class="ms-option"><input type="checkbox" value="${v}" onchange="updateMsLabel('${pageId}','${field}');applyDashboardFilter('${pageId}')"> ${v}</label>`
                            ).join('');
                        }
                    })
                    .catch(err => console.warn('Could not load options for ' + field + ':', err));
            }
        }

        // Store render functions on window so applyDashboardFilter can re-invoke them
        window['renderFn_total_funding_kpi'] = function(data) {
            const value = (data && data[0] && data[0].y !== undefined) ? parseFloat(data[0].y) : null;
            const el = document.getElementById('chart-overview-total_funding_kpi');
            if (el) el.textContent = formatMetric(value, ',.0f', '');
        };
        window['renderFn_total_deals_kpi'] = function(data) {
            const value = (data && data[0] && data[0].y !== undefined) ? parseFloat(data[0].y) : null;
            const el = document.getElementById('chart-overview-total_deals_kpi');
            if (el) el.textContent = formatMetric(value, ',.0f', '');
        };
        window['renderFn_bar_by_industry'] = function(data) {
            
            const plot = Plot.plot({
                marks: [
                    Plot.barY(data, {
                        x: "x",
                        y: "y",
                        fill: "#bd93f9",
                        sort: null,
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                x: {
                    domain: data.map(d => d.x),
                    tickRotate: -45,
                    label: "industry"
                },
                y: { label: "funding_amount" },
                marginLeft: 60,
                marginBottom: 100,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-bar_by_industry').appendChild(plot);
        };
        window['renderFn_pie_by_stage'] = function(data) {
            const pieWidth = 400;
            const pieHeight = 400;
            const legendWidth = 150;
            const totalWidth = pieWidth + legendWidth;
            const radius = Math.min(pieWidth, pieHeight) / 2 - 10;
            const pie = d3.pie().value(d => d.y);
            const arc = d3.arc().innerRadius(0).outerRadius(radius);
            const themeColors = ["#50fa7b", "#ffb86c", "#ff5555", "#8be9fd", "#f1fa8c"];
            const color = d3.scaleOrdinal()
                .domain(data.map(d => d.x))
                .range(themeColors);
            const svg = d3.create("svg")
                .attr("width", totalWidth)
                .attr("height", pieHeight)
                .attr("viewBox", [0, 0, totalWidth, pieHeight])
                .attr("style", "max-width: 100%; height: auto;");
            const pieGroup = svg.append("g")
                .attr("transform", `translate(${pieWidth / 2}, ${pieHeight / 2})`);
            pieGroup.selectAll("path")
                .data(pie(data))
                .join("path")
                .attr("fill", d => color(d.data.x))
                .attr("d", arc)
                .attr("stroke", "white")
                .attr("stroke-width", 2)
                .append("title")
                .text(d => `${d.data.x}: ${d.data.y}`);
            const legend = svg.append("g")
                .attr("transform", `translate(${pieWidth + 10}, 20)`);
            data.forEach((d, i) => {
                const legendRow = legend.append("g")
                    .attr("transform", `translate(0, ${i * 25})`);
                legendRow.append("rect")
                    .attr("width", 15)
                    .attr("height", 15)
                    .attr("fill", color(d.x))
                    .attr("rx", 2);
                legendRow.append("text")
                    .attr("x", 22)
                    .attr("y", 12)
                    .attr("fill", "#f8f8f2")
                    .style("font-size", "13px")
                    .text(d.x);
            });
            document.getElementById('chart-overview-pie_by_stage').appendChild(svg.node());
        };
        window['renderFn_line_over_time'] = function(data) {
            data = data.filter(d => d.x != null && d.y != null); data.forEach(d => d.x = new Date(d.x));
            const plot = Plot.plot({
                marks: [
                    Plot.line(data, {
                        x: "x",
                        y: "y",
                        stroke: "#bd93f9",
                        strokeWidth: 2,
                        tip: true
                    }),
                    Plot.dot(data, {
                        x: "x",
                        y: "y",
                        fill: "#bd93f9",
                        r: 4
                    }),
                    Plot.ruleY([0])
                ],
                x: { type: "utc", tickRotate: -45, label: "funding_date" },
                y: { label: "funding_amount" },
                marginLeft: 60,
                marginBottom: 100,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-line_over_time').appendChild(plot);
        };
        window['renderFn_scatter_funding_vs_valuation'] = function(data) {
            data = data.filter(d => d.x != null && d.y != null);
            const plot = Plot.plot({
                marks: [
                    Plot.dot(data, {
                        x: "x",
                        y: "y",
                        fill: "#bd93f9",
                        r: 3,
                        opacity: 0.3,
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                x: { label: "funding_amount" },
                y: { label: "valuation" },
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-scatter_funding_vs_valuation').appendChild(plot);
        };
        window['renderFn_geo_by_country'] = function(data) {
            const enc = "name" || detectGeoEncoding(data.map(d => d.x));
            const geoLookup = new Map(data.map(d => [normalizeCountryToTopo(d.x, enc).toLowerCase(), d.y]));
            const plot = Plot.plot({
                width: 928,
                marks: [
                    Plot.sphere({fill: "#1a1a2e", stroke: "#555570"}),
                    Plot.graticule({stroke: "#55557040", strokeWidth: 0.5}),
                    Plot.geo(window.worldTopojson, {
                        fill: d => {
                            const topoName = d.properties ? d.properties.name : null;
                            if (!topoName) return null;
                            return geoLookup.get(topoName.toLowerCase()) ?? null;
                        },
                        stroke: "#555570",
                        strokeWidth: 0.5,
                        tip: true
                    })
                ],
                projection: "equal-earth",
                color: {
                    type: "linear",
                    scheme: "purples",
                    unknown: "#2a2a3e",
                    legend: true,
                    label: "funding_amount"
                },
                margin: 2,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-geo_by_country').appendChild(plot);
        };
        window['renderFn_top_countries'] = function(data) {
            
            const plot = Plot.plot({
                marks: [
                    Plot.barY(data, {
                        x: "x",
                        y: "y",
                        fill: "#bd93f9",
                        sort: null,
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                x: {
                    domain: data.map(d => d.x),
                    tickRotate: -45,
                    label: "country"
                },
                y: { label: "funding_amount" },
                marginLeft: 60,
                marginBottom: 100,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#f8f8f2"
                }
            });
            document.getElementById('chart-overview-top_countries').appendChild(plot);
        };

        // Initialize filter dropdowns
        Object.keys(PAGE_CHARTS).forEach(pageId => loadFilterOptions(pageId));

        // Load all charts independently
        Promise.allSettled([
        loadMetric('chart-overview-total_funding_kpi', 'total_funding_kpi', window['renderFn_total_funding_kpi']),
        loadMetric('chart-overview-total_deals_kpi', 'total_deals_kpi', window['renderFn_total_deals_kpi']),
        loadChart('chart-overview-bar_by_industry', 'bar_by_industry', window['renderFn_bar_by_industry']),
        loadChart('chart-overview-pie_by_stage', 'pie_by_stage', window['renderFn_pie_by_stage']),
        loadChart('chart-overview-line_over_time', 'line_over_time', window['renderFn_line_over_time']),
        loadChart('chart-overview-scatter_funding_vs_valuation', 'scatter_funding_vs_valuation', window['renderFn_scatter_funding_vs_valuation']),
        loadChart('chart-overview-geo_by_country', 'geo_by_country', window['renderFn_geo_by_country']),
        loadChart('chart-overview-top_countries', 'top_countries', window['renderFn_top_countries'])
        ]);
    </script>
</body>
</html>

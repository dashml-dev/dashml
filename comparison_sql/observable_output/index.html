<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, sans-serif;
            background-color: #ffffff;
            color: #000000;
            padding: 2rem;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .card {
            margin-bottom: 3rem;
            background: #ffffff;
            padding: 1.5rem;
            border-radius: 8px;
        }

        .page-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid rgba(128, 128, 128, 0.2);
            padding-bottom: 0;
        }

        .tab-button {
            background: none;
            border: none;
            color: #000000;
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            font-size: 1rem;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            opacity: 0.6;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        .tab-button.active {
            opacity: 1;
            border-bottom-color: #4269d0;
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        .page-description {
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 1.5rem;
        }

        /* Observable Plot chart styling */
        svg {
            background: transparent;
        }
    </style>
</head>
<body>
    <h1>Simple Dashboard</h1>

    <script>
        // Column types from INFORMATION_SCHEMA (auto-detected)
        let columnTypes = {};
        // Load data from Flask API
        let dashmlData = [];

        // Get effective type: explicit > schema-detected > undefined
        function getEffectiveType(column, explicitType) {
            if (explicitType) return explicitType;
            return columnTypes[column] || undefined;
        }

        // Fetch schema first, then data
        Promise.all([
            fetch('/api/schema').then(r => r.json()),
            fetch('/api/data').then(r => r.json())
        ])
            .then(([schema, data]) => {
                columnTypes = schema;
                dashmlData = data;
                console.log('Column types from INFORMATION_SCHEMA:', columnTypes);
                renderAllCharts();
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.body.innerHTML += '<p style="color: red;">Error loading data from database</p>';
            });
    </script>

    <div class="card">
        <h2>Sales by Country</h2>
        <div id="chart-sales_chart"></div>
    </div>
    <script>
        function renderAllCharts() {
            // Chart: sales_chart
            const data_sales_chart = (() => {
                const effectiveXType = getEffectiveType('country', undefined);
                const result = d3.rollups(
                    dashmlData,
                    v => d3.sum(v, d => d['sales']),
                    d => d['country']
                ).map(([country, sales]) => ({ country, sales }));

                // Sort based on effective x_type
                if (effectiveXType === 'date') {
                    result.sort((a, b) => new Date(a.country) - new Date(b.country));
                } else if (effectiveXType === 'number') {
                    result.sort((a, b) => a.country - b.country);
                }
                return result;
            })();
            const plot_sales_chart = Plot.plot({
                marks: [
                    Plot.barY(data_sales_chart, {
                        x: "country",
                        y: "sales",
                        fill: "#4269d0",
                        tip: true
                    }),
                    Plot.ruleY([0])
                ],
                marginLeft: 60,
                marginBottom: 40,
                grid: true,
                style: {
                    background: "transparent",
                    color: "#000000"
                }
            });
            document.getElementById('chart-sales_chart').appendChild(plot_sales_chart);
        }
    </script>
</body>
</html>

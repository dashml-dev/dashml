<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Analytics Dashboard</title>
  <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #282a36;
      color: #f8f8f2;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: #282a36;
      padding: 0;
    }
    .card {
      background-color: #313343;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 4px rgba(255,255,255,0.1);
      margin-bottom: 20px;
    }
    h1 {
      margin-top: 0;
      color: #f8f8f2;
    }
    #chart {
      margin-top: 20px;
      min-height: 500px;
    }
    .chart-selector {
      margin: 20px 0;
    }
    select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #313343;
      color: #f8f8f2;
    }
    label {
      margin-right: 10px;
      font-weight: 500;
      color: #f8f8f2;
    }
    .page-tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      border-bottom: 2px solid #f8f8f240; /* 40 = 25% opacity hex */
      padding-bottom: 0;
    }
    .tab-button {
      padding: 10px 20px;
      background-color: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      color: #f8f8f2;
      opacity: 0.7;
      transition: all 0.2s;
    }
    .tab-button:hover {
      opacity: 1;
      background-color: #f8f8f210; /* 10 = ~6% opacity */
    }
    .tab-button.active {
      color: #bd93f9;
      border-bottom-color: #bd93f9;
      opacity: 1;
    }
    .page-container {
      margin-top: 20px;
    }
    .page-description {
      color: #f8f8f2;
      opacity: 0.8;
      margin-bottom: 20px;
    }
    .chart-container {
      margin: 20px 0;
      min-height: 400px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Sales Analytics Dashboard</h1>
    <div class="page-tabs">
      <button class="tab-button active" onclick="showPage('overview', this)">📊 Overview</button>
      <button class="tab-button" onclick="showPage('trends', this)">📈 Trends</button>
    </div>
    <div id="page-overview" class="page-container">
      <p class="page-description"><em>High-level sales metrics and KPIs</em></p>
      <div class="card">
        <div id="chart-total_sales_by_country"></div>
      </div>
      <div class="card">
        <div id="chart-country_sales_breakdown"></div>
      </div>
    </div>
    <div id="page-trends" class="page-container" style="display:none">
      <p class="page-description"><em>Sales trends and patterns over time</em></p>
      <div class="card">
        <div id="chart-sales_over_time"></div>
      </div>
      <div class="card">
        <div id="chart-average_sales_trend"></div>
      </div>
    </div>
  </div>
  <script>
    const theme = {"background": "#282a36", "card": "#313343", "text": "#f8f8f2", "primary": "#bd93f9", "secondary": ["#50fa7b", "#ffb86c", "#ff5555", "#8be9fd", "#f1fa8c"]};

    function aggregateData(data, xCol, yCol, aggFunc, xType) {
      const groups = {};
      data.forEach(row => {
        const key = row[xCol];
        if (!groups[key]) groups[key] = [];
        groups[key].push(parseFloat(row[yCol]) || 0);
      });

      const result = Object.entries(groups).map(([key, values]) => {
        let aggValue;
        switch (aggFunc) {
          case 'mean': aggValue = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggValue = values.length; break;
          default: aggValue = values.reduce((a, b) => a + b, 0);
        }
        return { x: key, y: aggValue };
      });

      // Sort based on x_type (explicit) or default - no sort
      if (xType === 'date') {
        result.sort((a, b) => new Date(a.x) - new Date(b.x));
      } else if (xType === 'number') {
        result.sort((a, b) => parseFloat(a.x) - parseFloat(b.x));
      }
      // No sort for 'string' or undefined

      return result;
    }

    function aggregateDataWithGroup(data, x, y, groupField, agg) {
      const grouped = {};
      data.forEach(row => {
        const xKey = row[x];
        const groupKey = row[groupField];
        const compositeKey = xKey + '|||' + groupKey;
        if (!grouped[compositeKey]) grouped[compositeKey] = { x: xKey, group: groupKey, values: [], count: 0 };
        grouped[compositeKey].values.push(parseFloat(row[y]) || 0);
        grouped[compositeKey].count++;
      });

      const result = [];
      Object.keys(grouped).forEach(key => {
        const entry = grouped[key];
        const values = entry.values;
        let aggregated;
        switch (agg) {
          case 'sum': aggregated = values.reduce((a, b) => a + b, 0); break;
          case 'mean': aggregated = values.reduce((a, b) => a + b, 0) / values.length; break;
          case 'count': aggregated = entry.count; break;
          default: aggregated = values.reduce((a, b) => a + b, 0);
        }
        result.push({ x: entry.x, group: entry.group, y: aggregated });
      });

      // Sort by x value (handles dates)
      result.sort((a, b) => {
        const aDate = new Date(a.x);
        const bDate = new Date(b.x);
        if (!isNaN(aDate) && !isNaN(bDate)) {
          return aDate - bDate;
        }
        return String(a.x).localeCompare(String(b.x));
      });

      return result;
    }


    function render_total_sales_by_country(data) {
      const grouped = aggregateData(data, 'shipping_address_state', 'total_amount', 'sum', undefined);
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      switch ('bar') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Total Sales by State', font: { color: theme.text } },
        xaxis: { title: 'shipping_address_state', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-total_sales_by_country', [trace], layout, { responsive: true });
    }
    function render_country_sales_breakdown(data) {
      const grouped = aggregateData(data, 'shipping_address_state', 'total_amount', 'sum', undefined);
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      switch ('pie') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Market Share by State', font: { color: theme.text } },
        xaxis: { title: 'shipping_address_state', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-country_sales_breakdown', [trace], layout, { responsive: true });
    }
    function render_sales_over_time(data) {
      const grouped = aggregateData(data, 'order_date', 'total_amount', 'sum', 'date');
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      switch ('line') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Sales Over Time', font: { color: theme.text } },
        xaxis: { title: 'order_date', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-sales_over_time', [trace], layout, { responsive: true });
    }
    function render_average_sales_trend(data) {
      const grouped = aggregateData(data, 'order_date', 'total_amount', 'mean', 'date');
      const xValues = grouped.map(d => d.x);
      const yValues = grouped.map(d => d.y);

      let trace;
      switch ('line') {
        case 'line':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'lines+markers', line: { color: theme.primary } };
          break;
        case 'scatter':
          trace = { x: xValues, y: yValues, type: 'scatter', mode: 'markers', marker: { color: theme.primary } };
          break;
        case 'pie':
          trace = { labels: xValues, values: yValues, type: 'pie', marker: { colors: theme.secondary } };
          break;
        case 'area':
          trace = { x: xValues, y: yValues, type: 'scatter', fill: 'tozeroy', mode: 'lines', line: { color: theme.primary }, fillcolor: theme.primary + '40' };
          break;
        case 'histogram':
          trace = { x: xValues, type: 'histogram', marker: { color: theme.primary } };
          break;
        default:
          trace = { x: xValues, y: yValues, type: 'bar', marker: { color: theme.primary } };
      }

      const layout = {
        title: { text: 'Average Daily Sales', font: { color: theme.text } },
        xaxis: { title: 'order_date', color: theme.text, gridcolor: theme.text + '20' },
        yaxis: { title: 'total_amount', color: theme.text, gridcolor: theme.text + '20' },
        margin: { t: 60, r: 40, b: 60, l: 60 },
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)'
      };

      Plotly.newPlot('chart-average_sales_trend', [trace], layout, { responsive: true });
    }


    function showPage(pageId, clickedButton) {
      document.querySelectorAll('.page-container').forEach(page => {
        page.style.display = 'none';
      });
      document.querySelectorAll('.tab-button').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById('page-' + pageId).style.display = 'block';
      if (clickedButton) {
        clickedButton.classList.add('active');
      }
    }


    function renderAllPages(data) {
      render_total_sales_by_country(data);
      render_country_sales_breakdown(data);
      render_sales_over_time(data);
      render_average_sales_trend(data);
    }

    fetch('/api/data')
      .then(response => response.json())
      .then(data => {
        renderAllPages(data);
      })
      .catch(error => console.error('Error loading data:', error));
  </script>
</body>
</html>
